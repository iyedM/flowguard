[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.1.0"
description = "Contract-Aware Runtime Verification, Bounded Recovery & Side-Effect Idempotency for Agentic n8n Workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Iyed Mohamed", email = "iyed.mohamed0103@gmail.com"}
]
dependencies = [
    "jsonschema>=4.10.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "reportlab>=4.0.0",
]

[project.scripts]
flowguard = "flowguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowguard*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
